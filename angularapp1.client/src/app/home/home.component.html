<div class="home">
  <div class="home__bg" aria-hidden="true">
    <span class="home__blob home__blob--1"></span>
    <span class="home__blob home__blob--2"></span>
    <span class="home__blob home__blob--3"></span>
  </div>

  <main class="home__panel">
    <div class="home__user-bar">
      <span class="home__user-name">{{ displayName }}</span>
      <div class="home__user-actions">
        <button
          class="home__theme-btn"
          type="button"
          [class.is-dark]="isDarkMode()"
          (click)="toggleDarkMode()"
          aria-label="Przełącz motyw">
          <svg class="theme-icon icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        @if (isAdmin) {
          <button class="home__user-btn" type="button" (click)="goToAdminPanel()">
            PANEL ADMINA
          </button>
        }
        <button class="home__user-btn home__user-btn--logout" type="button" (click)="logout()">
          WYLOGUJ
        </button>
      </div>
    </div>

    <header class="home__header">
      <div class="home__logo-glow" aria-hidden="true"></div>
      <img
        class="home__logo"
        src="assets/rekord-logo.png"
        alt="REKORD – Systemy Informatyczne"
      />
      <p class="home__subtitle">System kluczykowy · Bielsko-Biała</p>
    </header>

    <nav class="home__actions" aria-label="Główne operacje">
      <button
        class="home__btn home__btn--take"
        type="button"
        routerLink="/scanner"
        [queryParams]="{ mode: 'take' }"
      >
        ZBIERZ KLUCZ
      </button>

      <button
        class="home__btn home__btn--return"
        type="button"
        routerLink="/scanner"
        [queryParams]="{ mode: 'return' }"
      >
        ODDAJ KLUCZ
      </button>
    </nav>
  </main>
</div>
